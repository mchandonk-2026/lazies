name: Deploy The Lazies to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Create transparent original logo and update website
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          from collections import deque
          from pathlib import Path
          source = Path("assets/WhatsApp Image 2026-11-14 at 12.03.19.jpeg")
          dest = Path("assets/logo-transparente.png")
          im = Image.open(source).convert("RGBA")
          w, h = im.size
          pixels = im.load()
          # Remove only background connected to the image edges.
          # Do not use a circular mask: the L and S extend past the circle.
          corners = [pixels[0,0],pixels[w-1,0],pixels[0,h-1],pixels[w-1,h-1]]
          bg = tuple(sum(c[i] for c in corners)//4 for i in range(3))
          seen = bytearray(w*h)
          q = deque()
          for x in range(w):
              q.append((x,0)); q.append((x,h-1))
          for y in range(h):
              q.append((0,y)); q.append((w-1,y))
          while q:
              x,y = q.popleft()
              idx = y*w+x
              if seen[idx]: continue
              seen[idx] = 1
              r,g,b,_ = pixels[x,y]
              if max(abs(r-bg[0]),abs(g-bg[1]),abs(b-bg[2])) > 36: continue
              pixels[x,y] = (r,g,b,0)
              if x>0: q.append((x-1,y))
              if x<w-1: q.append((x+1,y))
              if y>0: q.append((x,y-1))
              if y<h-1: q.append((x,y+1))
          im.save(dest, optimize=True)
          html = Path("index.html")
          content = html.read_text()
          content = content.replace("assets/WhatsApp%20Image%202026-11-14%20at%2012.03.19.jpeg", "assets/logo-transparente.png")\n          content = content.replace("clip-path:circle(49% at 50% 50%)!important", "clip-path:none!important")
          html.write_text(content)
          print(f"Created {dest} from original JPEG ({w}x{h})")
          PY
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
